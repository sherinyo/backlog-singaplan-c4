schema_version: "1.0"

github:
  owner: "sherinyo"
  repository: "backlog-singaplan-c4"
  project_number: 4
  project_id: "PVT_kwHOCZ67is4BiEIs"
  project_title: "C4 - Singaplan Project Planning"

paths:
  epics: "backlog/epics"
  user_stories: "backlog/user-stories"
  tasks: "backlog/tasks"
  sync_map: "automation/sync-map.json"

sync:
  default_mode: "dry-run"
  require_approval: true
  create_parent_relationships: true
  create_dependencies: true
  update_project_fields: true
  allow_delete: false
  allow_archive: false

required_status_for_apply: "Approved for Sync"

required_approval:
  epic:
    - "PM"
  user_story:
    - "PM"
  task:
    - "PM"
    - "ROLE_OWNER_OR_TECH_LEAD"

approval_aliases:
  PM:
    - "sherinyo"
  ROLE_OWNER_OR_TECH_LEAD: []

project_fields:
  status: "Status"
  priority: "Priority"
  estimate: "Estimate"
  start_date: "Start Date"
  target_date: "Target Date"

allowed_statuses:
  - "Draft"
  - "Needs Refinement"
  - "Ready for Breakdown"
  - "Technical Review"
  - "Approved for Sync"
  - "Synced"
  - "Verified"

status_mapping:
  Draft: "Todo"
  Needs Refinement: "Todo"
  Ready for Breakdown: "Todo"
  Technical Review: "Todo"
  Approved for Sync: "Todo"
  Synced: "Todo"
  Verified: "Done"

priority_options:
  - "High"
  - "Medium"
  - "Low"